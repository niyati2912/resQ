<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Become a Donor | ResQ</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- Navbar -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            <span class="logo-icon">
                🩸
            </span>

            Res<span>Q</span>
        </a>


        <div class="nav-actions">

            <a
                href="index.html"
                class="secondary-btn"
            >
                ← Back to Home
            </a>

        </div>

    </header>


    <!-- Donor Form -->

    <main class="donor-page">

        <section class="donor-container">

            <div class="form-intro">

                <span class="form-badge">
                    🩸 JOIN THE RESQ COMMUNITY
                </span>

                <h1>
                    Become a <span>Life Saver</span>
                </h1>

                <p>
                    Register as a blood donor and help
                    someone during an emergency.
                </p>

            </div>


            <form id="donorForm">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="donorName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="donorName"
                        placeholder="Enter your full name"
                    >

                    <small
                        class="error-message"
                        id="nameError"
                    ></small>

                </div>


                <!-- Blood Group -->

                <div class="form-group">

                    <label for="bloodGroup">
                        Blood Group
                    </label>

                    <select id="bloodGroup">

                        <option value="">
                            Select blood group
                        </option>

                        <option value="A+">
                            A+
                        </option>

                        <option value="A-">
                            A-
                        </option>

                        <option value="B+">
                            B+
                        </option>

                        <option value="B-">
                            B-
                        </option>

                        <option value="AB+">
                            AB+
                        </option>

                        <option value="AB-">
                            AB-
                        </option>

                        <option value="O+">
                            O+
                        </option>

                        <option value="O-">
                            O-
                        </option>

                    </select>

                    <small
                        class="error-message"
                        id="bloodError"
                    ></small>

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter 10-digit phone number"
                    >

                    <small
                        class="error-message"
                        id="phoneError"
                    ></small>

                </div>


                <!-- City -->

                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                    >

                    <small
                        class="error-message"
                        id="cityError"
                    ></small>

                </div>


                <!-- Age -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="18"
                        max="65"
                    >

                    <small
                        class="error-message"
                        id="ageError"
                    ></small>

                </div>


                <!-- Availability -->

                <div class="form-group">

                    <label for="availability">
                        Availability
                    </label>

                    <select id="availability">

                        <option value="">
                            Select availability
                        </option>

                        <option value="Available">
                            Available
                        </option>

                        <option value="Not Available">
                            Not Available
                        </option>

                    </select>

                    <small
                        class="error-message"
                        id="availabilityError"
                    ></small>

                </div>


                <button
                    type="submit"
                    class="submit-donor-btn"
                >
                    Register as Donor 🩸
                </button>


                <div
                    id="successMessage"
                    class="success-message"
                ></div>

            </form>

        </section>

    </main>


    <script src="js/donor.js"></script>

</body>

</html>
