<section class="auth-page">
    <div class="auth">

        <div class="auth-side">
            <img src="assets/resq-logo.png"/>

            <h1>Join ResQ.</h1>

            <p>
                Create your profile so ResQ can identify how you want
                to participate in the blood donation network.
            </p>

            <a
                class="btn btn-primary"
                href="emergency.html"
                style="margin-top:22px"
            >
                I Need Blood Now
            </a>
        </div>


        <div class="auth-form">

            <h2>Create Account</h2>

            <p>Tell us a little about yourself.</p>


            <form data-mode="signup" id="authForm">

                <div class="field">
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Your full name"
                        required
                    />
                </div>


                <div class="field">
                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                    />
                </div>


                <div class="field">
                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="9876543210"
                        required
                    />
                </div>


                <div class="field">
                    <label for="city">
                        City
                    </label>

                    <input
                        id="city"
                        type="text"
                        placeholder="Your city"
                        required
                    />
                </div>


                <div class="field">
                    <label for="bloodGroup">
                        Blood Group
                    </label>

                    <select id="bloodGroup" required>

                        <option value="">
                            Select blood group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>
                </div>


                <div class="field">
                    <label for="role">
                        I want to join as
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="Donor">
                            Blood Donor
                        </option>

                        <option value="Volunteer">
                            Volunteer
                        </option>

                        <option value="Doctor">
                            Doctor / Healthcare Professional
                        </option>

                    </select>
                </div>


                <div class="field">
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="At least 6 characters"
                        required
                    />
                </div>


                <button
                    class="btn btn-primary"
                    type="submit"
                >
                    Create Account
                </button>

            </form>


            <p
                class="success"
                id="authMessage"
                style="margin-top:15px"
            ></p>


            <div class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>
</section>
