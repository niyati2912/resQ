<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ResQ | My Account</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <a
            class="brand"
            href="index.html"
        >

            <img
                class="brand-logo"
                src="assets/resq-logo.png"
                alt="ResQ Logo"
            >

            <span class="brand-name">
                Res <span>Q</span>
            </span>

        </a>


        <nav class="nav">

            <div class="nav-label">
                Main
            </div>


            <a
                class="nav-link"
                data-page="index.html"
                href="index.html"
            >

                <i data-lucide="house"></i>

                <span
                    class="nav-text"
                    data-t="home"
                >
                    Home
                </span>

            </a>


            <a
                class="nav-link"
                data-page="find-blood.html"
                href="find-blood.html"
            >

                <i data-lucide="search"></i>

                <span
                    class="nav-text"
                    data-t="find"
                >
                    Find Blood
                </span>

            </a>


            <a
                class="nav-link"
                data-page="hospitals.html"
                href="hospitals.html"
            >

                <i data-lucide="map"></i>

                <span
                    class="nav-text"
                    data-t="hospitals"
                >
                    Hospitals
                </span>

            </a>


            <a
                class="nav-link"
                data-page="dashboard.html"
                href="dashboard.html"
            >

                <i data-lucide="layout-dashboard"></i>

                <span
                    class="nav-text"
                    data-t="dashboard"
                >
                    Dashboard
                </span>

            </a>


            <div class="nav-label">
                Tools
            </div>


            <a
                class="nav-link"
                data-page="eligibility.html"
                href="eligibility.html"
            >

                <i data-lucide="clipboard-check"></i>

                <span
                    class="nav-text"
                    data-t="eligibility"
                >
                    Eligibility
                </span>

            </a>


            <a
                class="nav-link"
                data-page="compatibility.html"
                href="compatibility.html"
            >

                <i data-lucide="git-compare"></i>

                <span
                    class="nav-text"
                    data-t="compatibility"
                >
                    Compatibility
                </span>

            </a>


            <a
                class="nav-link"
                data-page="resources.html"
                href="resources.html"
            >

                <i data-lucide="newspaper"></i>

                <span
                    class="nav-text"
                    data-t="resources"
                >
                    Resources
                </span>

            </a>


            <!-- ACCOUNT SECTION -->

            <div id="accountSection">

                <div class="nav-label">
                    Account
                </div>


                <a
                    class="nav-link"
                    data-page="login.html"
                    href="login.html"
                >

                    <i data-lucide="log-in"></i>

                    <span class="nav-text">
                        Login
                    </span>

                </a>


                <a
                    class="nav-link"
                    data-page="signup.html"
                    href="signup.html"
                >

                    <i data-lucide="user-plus"></i>

                    <span class="nav-text">
                        Sign Up
                    </span>

                </a>

            </div>

        </nav>


        <div class="sidebar-bottom">

            <a
                class="emergency-link"
                href="emergency.html"
            >

                <i data-lucide="siren"></i>

                <span class="emergency-text">
                    I Need Blood Now
                </span>

            </a>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="top-left">

                <button
                    class="menu-btn"
                    id="menuBtn"
                    type="button"
                >

                    <i data-lucide="menu"></i>

                </button>


                <button
                    aria-label="Collapse navigation"
                    class="menu-btn nav-logo-btn"
                    id="collapseBtn"
                    type="button"
                >

                    <img
                        class="nav-toggle-logo"
                        src="assets/resq-logo.png"
                        alt="Toggle navigation"
                    >

                </button>


                <span class="top-title">
                    My Account
                </span>

            </div>


            <div class="top-right">

                <select
                    class="lang"
                    id="language"
                >

                    <option value="en">
                        EN
                    </option>

                    <option value="hi">
                        हिन्दी
                    </option>

                    <option value="pa">
                        ਪੰਜਾਬੀ
                    </option>

                </select>


                <button
                    class="theme-btn"
                    id="themeBtn"
                    type="button"
                >

                    <i data-lucide="moon"></i>

                </button>

            </div>

        </header>


        <!-- ACCOUNT PAGE -->

        <section class="account-page">

            <div class="account-header">

                <div class="account-avatar">
                    <i data-lucide="user-round"></i>
                </div>


                <div>

                    <h1 id="accountName">
                        Your Name
                    </h1>

                    <p id="accountRole">
                        ResQ Member
                    </p>

                </div>

            </div>


            <div class="account-layout">

                <!-- PROFILE INFORMATION -->

                <section class="account-card">

                    <div class="account-card-heading">

                        <div>

                            <h2>
                                Profile Information
                            </h2>

                            <p>
                                Update the information associated with your ResQ account.
                            </p>

                        </div>


                        <i data-lucide="user-cog"></i>

                    </div>


                    <form id="profileForm">

                        <div class="account-form-grid">

                            <div class="field">

                                <label for="profileName">
                                    Full Name
                                </label>

                                <input
                                    id="profileName"
                                    type="text"
                                    required
                                >

                            </div>


                            <div class="field">

                                <label for="profileEmail">
                                    Email Address
                                </label>

                                <input
                                    id="profileEmail"
                                    type="email"
                                    required
                                >

                            </div>


                            <div class="field">

                                <label for="profilePhone">
                                    Phone Number
                                </label>

                                <input
                                    id="profilePhone"
                                    type="tel"
                                    required
                                >

                            </div>


                            <div class="field">

                                <label for="profileCity">
                                    City
                                </label>

                                <input
                                    id="profileCity"
                                    type="text"
                                    required
                                >

                            </div>


                            <div class="field">

                                <label for="profileBloodGroup">
                                    Blood Group
                                </label>

                                <select
                                    id="profileBloodGroup"
                                    required
                                >

                                    <option value="">
                                        Select blood group
                                    </option>

                                    <option value="A+">
                                        A+
                                    </option>

                                    <option value="A-">
                                        A-
                                    </option>

                                    <option value="B+">
                                        B+
                                    </option>

                                    <option value="B-">
                                        B-
                                    </option>

                                    <option value="AB+">
                                        AB+
                                    </option>

                                    <option value="AB-">
                                        AB-
                                    </option>

                                    <option value="O+">
                                        O+
                                    </option>

                                    <option value="O-">
                                        O-
                                    </option>

                                </select>

                            </div>


                            <div class="field">

                                <label for="profileRole">
                                    Role
                                </label>

                                <select
                                    id="profileRole"
                                    required
                                >

                                    <option value="Donor">
                                        Blood Donor
                                    </option>

                                    <option value="Volunteer">
                                        Volunteer
                                    </option>

                                    <option value="Doctor">
                                        Doctor / Healthcare Professional
                                    </option>

                                </select>

                            </div>

                        </div>


                        <button
                            class="btn btn-primary"
                            type="submit"
                        >

                            <i data-lucide="save"></i>

                            Save Changes

                        </button>


                        <p
                            class="account-message"
                            id="profileMessage"
                        ></p>

                    </form>

                </section>


                <!-- PASSWORD -->

                <section class="account-card">

                    <div class="account-card-heading">

                        <div>

                            <h2>
                                Security
                            </h2>

                            <p>
                                Change your account password.
                            </p>

                        </div>


                        <i data-lucide="shield-check"></i>

                    </div>


                    <form id="passwordForm">

                        <div class="field">

                            <label for="currentPassword">
                                Current Password
                            </label>


                            <div class="password-wrapper">

                                <input
                                    id="currentPassword"
                                    type="password"
                                    autocomplete="current-password"
                                    required
                                >


                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="currentPassword"
                                    aria-label="Show password"
                                >

                                    <i data-lucide="eye"></i>

                                </button>

                            </div>

                        </div>


                        <div class="field">

                            <label for="newPassword">
                                New Password
                            </label>


                            <div class="password-wrapper">

                                <input
                                    id="newPassword"
                                    type="password"
                                    minlength="6"
                                    autocomplete="new-password"
                                    required
                                >


                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="newPassword"
                                    aria-label="Show password"
                                >

                                    <i data-lucide="eye"></i>

                                </button>

                            </div>

                        </div>


                        <div class="field">

                            <label for="confirmPassword">
                                Confirm New Password
                            </label>


                            <div class="password-wrapper">

                                <input
                                    id="confirmPassword"
                                    type="password"
                                    minlength="6"
                                    autocomplete="new-password"
                                    required
                                >


                                <button
                                    class="password-toggle"
                                    type="button"
                                    data-password-toggle="confirmPassword"
                                    aria-label="Show password"
                                >

                                    <i data-lucide="eye"></i>

                                </button>

                            </div>

                        </div>


                        <button
                            class="btn btn-primary"
                            type="submit"
                        >

                            <i data-lucide="key-round"></i>

                            Change Password

                        </button>


                        <p
                            class="account-message"
                            id="passwordMessage"
                        ></p>

                    </form>

                </section>

            </div>

        </section>

    </main>

</div>


<script src="js/app.js"></script>
<script src="js/account.js"></script>

</body>

</html>
